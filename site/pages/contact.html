<section class="page-hero">
  <div class="wrap narrow">
    <p class="eyebrow dark">Contact</p>
    <h1>Questions? We're happy to help.</h1>
    <p class="lead">Email <a href="mailto:Support@PSTAppraisal.ca">Support@PSTAppraisal.ca</a> or use the form below. We usually reply within 1 business day.</p>
  </div>
</section>
<section class="section">
  <div class="wrap narrow">
    <form id="contact-form" class="panel" novalidate>
      <div class="grid">
        <label>Name<input name="name" required autocomplete="name"></label>
        <label>Email<input name="email" type="email" required autocomplete="email"></label>
        <label class="span2">Order reference (if you have one)<input name="ref" placeholder="VA-2026-XXXXXX"></label>
        <label class="span2">Message<textarea name="message" rows="6" required></textarea></label>
      </div>
      <p class="form-msg" hidden></p>
      <button class="btn" type="submit">Send message</button>
    </form>
  </div>
</section>
